name: Foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Rust verification used to be a single serial job; the four rust-*
  # jobs below run its suites in parallel, and the `rust` aggregator at the
  # end reports the branch-protection check named "Rust". Each job restores
  # its own Swatinem cache under a distinct shared-key so the jobs stop
  # overwriting one another's saved caches.
  rust-lint:
    name: Rust lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reclaim runner disk before building
        # The workspace outgrew the hosted runner's free space, and the failure
        # is not a clean "no space" error: the linker takes SIGBUS on a
        # truncated mapping, or the runner process itself dies mid-step, so a
        # full disk reads as an unrelated toolchain crash. None of these
        # preinstalled runtimes are used by this build.
        run: |
          set -euo pipefail
          df -h /
          # Unlink the two largest unused runtimes only. Reclaiming every
          # preinstalled SDK frees more, but the extra unlink I/O runs against
          # the same disk the build is about to use, and headroom is the point
          # here, not maximum free space.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          sync
          df -h /
      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1 --profile minimal
          --component clippy
          --component rustfmt
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: foundation-linux-lint
      - name: Check formatting
        run: cargo +1.97.1 fmt --all -- --check
      - name: Verify lockfile
        run: cargo +1.97.1 metadata --locked --no-deps --format-version 1 >/dev/null
      - name: Run Clippy
        run: cargo +1.97.1 clippy --locked --workspace --all-targets -- -D warnings

  rust-tests:
    name: Rust workspace tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reclaim runner disk before building
        # The workspace outgrew the hosted runner's free space, and the failure
        # is not a clean "no space" error: the linker takes SIGBUS on a
        # truncated mapping, or the runner process itself dies mid-step, so a
        # full disk reads as an unrelated toolchain crash. None of these
        # preinstalled runtimes are used by this build.
        run: |
          set -euo pipefail
          df -h /
          # Unlink the two largest unused runtimes only. Reclaiming every
          # preinstalled SDK frees more, but the extra unlink I/O runs against
          # the same disk the build is about to use, and headroom is the point
          # here, not maximum free space.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          sync
          df -h /
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: foundation-linux-tests
      - name: Run tests outside the source-acquirer policy
        run: >-
          cargo +1.97.1 test --locked --workspace
          --exclude mcloving-source-acquirer

  rust-source-acquirer:
    name: Rust source-acquirer suite
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reclaim runner disk before building
        # The workspace outgrew the hosted runner's free space, and the failure
        # is not a clean "no space" error: the linker takes SIGBUS on a
        # truncated mapping, or the runner process itself dies mid-step, so a
        # full disk reads as an unrelated toolchain crash. None of these
        # preinstalled runtimes are used by this build.
        run: |
          set -euo pipefail
          df -h /
          # Unlink the two largest unused runtimes only. Reclaiming every
          # preinstalled SDK frees more, but the extra unlink I/O runs against
          # the same disk the build is about to use, and headroom is the point
          # here, not maximum free space.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          sync
          df -h /
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: foundation-linux-source-acquirer
      - name: Prepare and activate source-acquirer isolation
        run: |
          bash scripts/prepare-source-transport-test-filesystems.sh
          bash scripts/validate-source-acquirer-apparmor.sh
          bash scripts/validate-external-shadow-apparmor.sh
          sudo apparmor_parser --replace --skip-cache \
            deploy/apparmor/mcloving-source-acquirer
          sudo apparmor_parser --replace --skip-cache \
            deploy/apparmor/mcloving-external-shadow-replay
      - name: Run source-acquirer tests with user-namespace authority
        run: >-
          aa-exec -p mcloving-source-acquirer --
          cargo +1.97.1 test --locked -p mcloving-source-acquirer
          -- --test-threads=1

  rust-boundary-suites:
    name: Rust boundary suites
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reclaim runner disk before building
        # The workspace outgrew the hosted runner's free space, and the failure
        # is not a clean "no space" error: the linker takes SIGBUS on a
        # truncated mapping, or the runner process itself dies mid-step, so a
        # full disk reads as an unrelated toolchain crash. None of these
        # preinstalled runtimes are used by this build.
        run: |
          set -euo pipefail
          df -h /
          # Unlink the two largest unused runtimes only. Reclaiming every
          # preinstalled SDK frees more, but the extra unlink I/O runs against
          # the same disk the build is about to use, and headroom is the point
          # here, not maximum free space.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          sync
          df -h /
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: foundation-linux-boundary
      - name: Prepare and activate source-acquirer isolation
        run: |
          bash scripts/prepare-source-transport-test-filesystems.sh
          bash scripts/validate-source-acquirer-apparmor.sh
          bash scripts/validate-external-shadow-apparmor.sh
          sudo apparmor_parser --replace --skip-cache \
            deploy/apparmor/mcloving-source-acquirer
          sudo apparmor_parser --replace --skip-cache \
            deploy/apparmor/mcloving-external-shadow-replay
      - name: Run dependency resolver in its exact-capacity transport boundary
        run: bash scripts/dependency-resolver-contained.sh
      - name: Run the complete destination-observer contract denominator
        run: |
          cargo +1.97.1 clippy --locked \
            -p mcloving-destination-observer \
            --all-targets --all-features -- -D warnings
          bash scripts/run-verified-rust-test.sh \
            58 destination-observer-contract \
            cargo +1.97.1 test --locked \
            -p mcloving-destination-observer \
            --all-features --test observer_contract
      - name: Run external connector contracts and prove shadow network denial
        run: |
          cargo +1.97.1 test --locked -p mcloving-external-connector \
            --features loopback-test
          cargo +1.97.1 build --locked -p mcloving-external-connector \
            --features loopback-test \
            --bin mcloving-external-shadow-network-probe
          cargo +1.97.1 build --locked -p mcloving-external-connector \
            --bin mcloving-external-shadow-replay
          if ./target/debug/mcloving-external-shadow-replay \
            2>target/shadow-replay-unconfined.log; then
            echo 'unconfined shadow replay unexpectedly started' >&2
            exit 1
          fi
          grep -Fq 'state_unavailable' target/shadow-replay-unconfined.log
          if aa-exec -p mcloving-external-shadow-replay -- \
            ./target/debug/mcloving-external-shadow-replay \
            2>target/shadow-replay-confined.log; then
            echo 'argument-free shadow replay unexpectedly started' >&2
            exit 1
          fi
          grep -Fq 'invalid_config' target/shadow-replay-confined.log
          aa-exec -p mcloving-external-shadow-replay -- \
            ./target/debug/mcloving-external-shadow-network-probe

  rust:
    name: Rust
    # Branch protection requires a check named exactly "Rust". This
    # aggregator holds that name over the parallel rust-* jobs above: it
    # always runs, and its single step fails unless every needed job's
    # result is literally "success", so `skipped` and `cancelled` fail the
    # required check rather than slipping past it.
    runs-on: ubuntu-24.04
    needs:
      - rust-lint
      - rust-tests
      - rust-source-acquirer
      - rust-boundary-suites
    if: always()
    steps:
      - name: Require every Rust suite to succeed
        run: |
          set -euo pipefail
          status=0
          while IFS=' ' read -r job result; do
            printf '%s: %s\n' "$job" "$result"
            if [ "$result" != "success" ]; then
              status=1
            fi
          done <<'RESULTS'
          rust-lint ${{ needs.rust-lint.result }}
          rust-tests ${{ needs.rust-tests.result }}
          rust-source-acquirer ${{ needs.rust-source-acquirer.result }}
          rust-boundary-suites ${{ needs.rust-boundary-suites.result }}
          RESULTS
          exit "$status"

  dependencies:
    name: Dependencies and licenses
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source /repo --no-banner --redact --verbose

  architecture:
    name: Architecture records
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Clojure CLI
        uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d # 13.6.1
        with:
          cli: 1.12.4.1618
      - name: Verify foundation records
        run: |
          bash -n scripts/validate-foundation.sh
          bash -n scripts/validate-source-acquirer-apparmor.sh
          bash -n scripts/validate-external-shadow-apparmor.sh
          bash -n scripts/dependency-resolver-contained.sh
          bash -n scripts/release-builder-contained.sh
          bash -n scripts/release-build-inner.sh
          bash -n scripts/mario-alpha-demo.sh
          bash -n scripts/mario-runtime-effect-rehearsal.sh
          bash -n scripts/test-state-policy-differential.sh
          bash -n scripts/test-boundary-differential.sh
          bash -n scripts/test-backup-restore.sh
          bash -n scripts/run-verified-rust-test.sh
          bash -n scripts/verify-boundary-runtime.sh
          python3 scripts/test-execution-board.py
          python3 scripts/verify-execution-board.py
          python3 scripts/test-ticket-closure-receipts.py
          python3 scripts/verify-ticket-closure-receipts.py
          python3 scripts/test-verify-rust-test-execution.py
          test "$(find docs/adr -maxdepth 1 -name '[0-9][0-9][0-9][0-9]-*.md' | wc -l)" -eq 15
          test -s docs/architecture/CHARTER.md
          test -s docs/ALPHA_DEMO.md
          test -s docs/threat-model/README.md
          test -s docs/EXECUTION_BOARD.md
      - name: Run Jenkins compatibility and plugin-directory contracts
        working-directory: compat/jenkins-worker
        run: |
          timeout 60 clojure -M:test
          ./test-plugin-directory.sh

  formal:
    name: Formal model
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download verified TLA+ tools
        run: |
          source tools/versions.env
          curl --fail --location --silent --show-error \
            "https://github.com/tlaplus/tlaplus/releases/download/v${TLAPLUS_VERSION}/tla2tools.jar" \
            --output /tmp/tla2tools.jar
          printf '%s  %s\n' "${TLAPLUS_SHA256}" /tmp/tla2tools.jar \
            | sha256sum -c -
      - name: Parse and check the attempt lease model
        run: |
          java -cp /tmp/tla2tools.jar tla2sany.SANY formal/tla/AttemptLease.tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -config formal/tla/AttemptLease.cfg \
          -workers auto \
          formal/tla/AttemptLease.tla

  controller-postgres:
    name: Controller PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: >-
          postgres@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_USER: mcloving
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: mcloving
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username mcloving --dbname mcloving"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      MCLOVING_TEST_DATABASE_URL: >-
        postgres://mcloving@127.0.0.1:5432/mcloving
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: foundation-linux
      - name: Run real-PostgreSQL transaction and race tests
        run: cargo +1.97.1 test --locked -p mcloving-controller-store --test postgres_truth
      - name: Run pipeline operational-state migration and fence tests
        run: >-
          cargo +1.97.1 test --locked
          -p mcloving-controller-store
          --test pipeline_operational_state
          -- --test-threads=1
      - name: Run typed trigger ingress, delivery, and schedule tests
        run: >-
          cargo +1.97.1 test --locked
          -p mcloving-controller-store
          --test trigger_ingress
          -- --test-threads=1
      - name: Run multibranch and organization discovery tests
        run: >-
          cargo +1.97.1 test --locked
          -p mcloving-controller-store
          --test discovery
          -- --test-threads=1
      - name: Run trigger API authorization, filtering, and replay tests
        run: >-
          cargo +1.97.1 test --locked
          -p mcloving-controller-api
          --test route_denials
          -- --test-threads=1
      - name: Run durable identity lifecycle and tenant-isolation tests
        run: cargo +1.97.1 test --locked -p mcloving-controller-store --test identity_lifecycle
      - name: Run immutable authorization mapping and rollback tests
        run: cargo +1.97.1 test --locked -p mcloving-controller-store --test authorization_mapping
      - name: Run external read consumer cutover and rollback tests
        run: cargo +1.97.1 test --locked -p mcloving-controller-store --test external_read_consumers
      - name: Run external admin client cutover and rollback tests
        run: cargo +1.97.1 test --locked -p mcloving-controller-store --test external_admin_clients
      - name: Run contained OIDC protocol and session tests
        run: cargo +1.97.1 test --locked -p mcloving-controller-api --test oidc_flow
      - name: Run unsupported-spec admission gate against PostgreSQL
        run: >-
          bash scripts/run-verified-rust-test.sh
          1 unsupported-spec --require-postgres
          cargo +1.97.1 test --locked
          -p mcloving-controller-api
          --test unsupported_spec_gate
      - name: Run real execution-spine contracts against PostgreSQL
        run: >-
          bash scripts/run-verified-rust-test.sh
          30 real-spine --require-postgres
          cargo +1.97.1 test --locked
          -p mcloving-execution-spine
          --test real_spine
          -- --test-threads=1
      - name: Run shipped-controller credential rollout and rollback tests
        # `-- --ignored` because the gate is now #[ignore]d: it used to return
        # success with no assertions when MCLOVING_TEST_DATABASE_URL was unset,
        # and DEPLOY-001's acceptance names it, so an acceptance criterion was
        # satisfiable by not running. Without this flag it would not run here.
        run: >-
          bash scripts/run-verified-rust-test.sh
          2 deployable-runtime --require-postgres
          cargo +1.97.1 test --locked
          -p mcloving-controller --test deployable_runtime -- --ignored
      - name: Run controller differential and capability gates
        run: |
          bash scripts/run-verified-rust-test.sh \
            1 controller-differential --require-postgres \
            cargo +1.97.1 test --locked -p mcloving-controller --test diff_001
          bash scripts/run-verified-rust-test.sh \
            2 capability-vocabulary --require-postgres \
            cargo +1.97.1 test --locked -p mcloving-controller --test capability_vocabulary
      - name: Build the shipped controller for remote-agent gates
        run: cargo +1.97.1 build --locked -p mcloving-controller
      - name: Run shipped remote-agent execution gates against PostgreSQL
        env:
          MCLOVING_CONTROLLER_BINARY: ${{ github.workspace }}/target/debug/mcloving-controller
        run: |
          # These binaries launch controller/agent processes on reserved
          # loopback ports. Keep each binary serial so the bind after
          # reservation release cannot race a sibling test for the same port.
          bash scripts/run-verified-rust-test.sh \
            3 remote-work --require-postgres \
            cargo +1.97.1 test --locked -p mcloving-agent --test remote_work -- --test-threads=1
          bash scripts/run-verified-rust-test.sh \
            1 identity-collision --require-postgres \
            cargo +1.97.1 test --locked -p mcloving-agent --test identity_collision -- --test-threads=1
          bash scripts/run-verified-rust-test.sh \
            2 long-step-lease --require-postgres \
            cargo +1.97.1 test --locked -p mcloving-agent --test long_step_lease -- --test-threads=1

  recovery-drill:
    name: Backup and restore
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run isolated logical backup and restore drill
        run: bash scripts/test-backup-restore.sh docker

  # DEPLOY-001's acceptance is that a scripted install on a clean host brings
  # the spine up and its upgrade and rollback paths hold. Nothing ran that
  # script here, so every fail-closed gate in it -- tampered releases,
  # placeholder contracts, the environment-file grammar, digest drift, the
  # recovery command -- was asserted and never executed.
  deployment:
    name: Deployment lane
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: foundation-linux
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android
          # The 20260823 hosted image ships these root-owned Quadlet/systemd
          # ancestors as 0777. The deployment correctly refuses a future
          # source/drop-in creation point beneath them. This job owns the
          # disposable VM, so make the exact package roots meet the production
          # invariant before exercising the unchanged fallback specification.
          for directory in /usr/share /usr/share/containers /usr/share/systemd; do
            test ! -d "${directory}" || sudo chmod go-w "${directory}"
          done
          sync
      - name: Run the deployment smoke test
        # The smoke test preserves its working directory on failure, but a
        # runner's /tmp does not survive the job. A fixed TMPDIR gives the
        # preserved tree a path the artifact upload below can name.
        run: |
          mkdir -p "${RUNNER_TEMP}/mcloving-smoke"
          # The ancestor walk reaches "/" since DEPLOY-004, so TMPDIR and its
          # parents are judged like any other component of the chain. mkdir
          # honours the runner's umask, which is not ours to assume; this is
          # the one level we own. A refusal naming a path ABOVE this directory
          # is the runner image's own tree. The known unsafe package roots are
          # normalized explicitly above; print this separate chain so any new
          # image drift is one look rather than one bisect.
          chmod 755 "${RUNNER_TEMP}/mcloving-smoke"
          stat -c '%a %u %n' / /home "${HOME}" "$(dirname "${RUNNER_TEMP}")" \
            "${RUNNER_TEMP}" "${RUNNER_TEMP}/mcloving-smoke" || true
          TMPDIR="${RUNNER_TEMP}/mcloving-smoke" bash deploy/test-deployment.sh
      - name: Build the service-managed runtime gate and exact release
        id: systemd-inputs
        run: |
          cargo +1.97.1 test --locked --no-run \
            -p mcloving-controller --test deployable_runtime \
            --message-format=json > "${RUNNER_TEMP}/deployable-runtime-build.json"
          runtime_gate="$(jq -r '
            select(.reason == "compiler-artifact")
            | select(.target.name == "deployable_runtime")
            | .executable // empty
          ' "${RUNNER_TEMP}/deployable-runtime-build.json" | tail -1)"
          test -n "${runtime_gate}"
          test -x "${runtime_gate}"
          release_dir="${RUNNER_TEMP}/mcloving-systemd-release"
          install -d -m 0755 "${release_dir}"
          for binary in mcloving-controller mcloving-agent mcloving-cli mcloving-identity-admin; do
            install -m 0755 "target/debug/${binary}" "${release_dir}/${binary}"
          done
          (
            cd "${release_dir}"
            sha256sum mcloving-controller mcloving-agent \
              mcloving-cli mcloving-identity-admin > checksums.sha256
          )
          echo "runtime_gate=${runtime_gate}" >> "${GITHUB_OUTPUT}"
          echo "release_dir=${release_dir}" >> "${GITHUB_OUTPUT}"
      - name: Run the deployment under a controlled real user manager
        run: >-
          bash deploy/run-systemd-ci.sh
          "${{ steps.systemd-inputs.outputs.runtime_gate }}"
          "${{ steps.systemd-inputs.outputs.release_dir }}"
          "${{ steps.systemd-inputs.outputs.release_dir }}/checksums.sha256"
      - name: Upload the preserved smoke-test working directory
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-smoke-workdir
          # The deployed trees are hidden directories under the preserved
          # home, and the four debug binaries are copied into every release
          # directory the test stages -- gigabytes that carry no diagnostic
          # value, excluded by name.
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/mcloving-smoke/
            !${{ runner.temp }}/mcloving-smoke/**/mcloving-controller
            !${{ runner.temp }}/mcloving-smoke/**/mcloving-agent
            !${{ runner.temp }}/mcloving-smoke/**/mcloving-cli
            !${{ runner.temp }}/mcloving-smoke/**/mcloving-identity-admin
          if-no-files-found: warn
          retention-days: 7
