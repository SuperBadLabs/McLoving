name: Windows Agent

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  impact:
    name: Classify Windows impact
    runs-on: ubuntu-24.04
    outputs:
      run-windows: ${{ steps.impact.outputs.run-windows }}
    steps:
      - name: Check out source and comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        if: github.event_name == 'pull_request'
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Test impact classifier
        if: github.event_name == 'pull_request'
        run: python3 scripts/test-windows-agent-impact.py
      - name: Classify exact change
        id: impact
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "push" ]]; then
            printf 'run-windows=true\n' >> "${GITHUB_OUTPUT}"
          else
            python3 scripts/windows-agent-impact.py \
              --base "${BASE_SHA}" \
              --head "${HEAD_SHA}" \
              >> "${GITHUB_OUTPUT}"
          fi

  windows-agent:
    name: Windows agent
    needs: impact
    if: needs.impact.outputs.run-windows == 'true'
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: >-
          rustup toolchain install 1.97.1 --profile minimal
          --component clippy
          --component rustfmt
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: windows-agent
      - name: Check Windows production agent
        shell: pwsh
        run: cargo +1.97.1 check --locked -p mcloving-agent --bin mcloving-agent
      - name: Check Windows differential aggregate
        shell: pwsh
        run: cargo +1.97.1 check --locked -p mcloving-differential-aggregate
      - name: Check Windows migration package
        shell: pwsh
        run: cargo +1.97.1 check --locked -p mcloving-migration-package
      - name: Check Windows Jenkins state transfer
        shell: pwsh
        run: cargo +1.97.1 check --locked -p mcloving-jenkins-state-transfer --all-targets
      - name: Lint Windows production agent
        shell: pwsh
        run: cargo +1.97.1 clippy --locked -p mcloving-agent --bin mcloving-agent -- -D warnings
      - name: Lint Windows differential aggregate
        shell: pwsh
        run: cargo +1.97.1 clippy --locked -p mcloving-differential-aggregate --all-targets -- -D warnings
      - name: Lint Windows migration package
        shell: pwsh
        run: cargo +1.97.1 clippy --locked -p mcloving-migration-package --all-targets -- -D warnings
      - name: Lint Windows Jenkins state transfer
        shell: pwsh
        run: cargo +1.97.1 clippy --locked -p mcloving-jenkins-state-transfer --all-targets -- -D warnings
      - name: Run Windows-specific runtime tests
        shell: pwsh
        run: cargo +1.97.1 test --locked -p mcloving-agent-runtime -p mcloving-agent -p mcloving-windows-job
      - name: Run Windows differential aggregate tests
        shell: pwsh
        run: cargo +1.97.1 test --locked -p mcloving-differential-aggregate
      - name: Run Windows migration package tests
        shell: pwsh
        run: cargo +1.97.1 test --locked -p mcloving-migration-package
      - name: Run Windows Jenkins state-transfer tests
        shell: pwsh
        run: cargo +1.97.1 test --locked -p mcloving-jenkins-state-transfer
      - name: Build debug agent for native service gate
        shell: pwsh
        run: cargo +1.97.1 build --locked -p mcloving-agent
      - name: Run debug native service and crash-recovery war gate
        shell: pwsh
        run: >-
          ./scripts/windows-agent-war.ps1
          -AgentBinary ./target/debug/mcloving-agent.exe
      - name: Build release agent
        shell: pwsh
        run: cargo +1.97.1 build --locked --release -p mcloving-agent
      - name: Run native service and crash-recovery war gate
        shell: pwsh
        run: >-
          ./scripts/windows-agent-war.ps1
          -AgentBinary ./target/release/mcloving-agent.exe

  windows:
    name: Windows
    # The classifier is authoritative only when it succeeds. A true decision
    # requires the native Windows lane to succeed; a false decision requires
    # that lane to be skipped. Every other combination fails closed.
    runs-on: ubuntu-24.04
    needs:
      - impact
      - windows-agent
    if: always()
    steps:
      - name: Check out aggregate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require the classified Windows outcome
        env:
          IMPACT_RESULT: ${{ needs.impact.result }}
          RUN_WINDOWS: ${{ needs.impact.outputs.run-windows }}
          WINDOWS_AGENT_RESULT: ${{ needs.windows-agent.result }}
        run: |
          python3 scripts/verify-workflow-aggregate.py windows \
            impact="${IMPACT_RESULT}" \
            run-windows="${RUN_WINDOWS}" \
            windows-agent="${WINDOWS_AGENT_RESULT}"
