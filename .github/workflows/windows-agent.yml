name: Windows Agent

on:
  pull_request:
    paths:
      - ".github/workflows/windows-agent.yml"
      - "bins/agent/**"
      - "crates/agent-protocol/**"
      - "crates/agent-runtime/**"
      - "crates/domain/**"
      - "crates/windows-job/**"
      - "scripts/windows-agent-war.ps1"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-agent:
    name: Windows agent
    runs-on: windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: >-
          rustup toolchain install 1.97.1 --profile minimal
          --component clippy
          --component rustfmt
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: windows-agent
      - name: Check Windows production agent
        shell: pwsh
        run: >-
          cargo +1.97.1 check --locked
          -p mcloving-agent
          --bin mcloving-agent
      - name: Lint Windows production agent
        shell: pwsh
        run: >-
          cargo +1.97.1 clippy --locked
          -p mcloving-agent
          --bin mcloving-agent
          -- -D warnings
      - name: Run Windows-specific runtime tests
        shell: pwsh
        run: >-
          cargo +1.97.1 test --locked
          -p mcloving-agent-runtime
          -p mcloving-windows-job
      - name: Build debug agent for native service gate
        shell: pwsh
        run: cargo +1.97.1 build --locked -p mcloving-agent
      - name: Run debug native service and crash-recovery war gate
        shell: pwsh
        run: >-
          ./scripts/windows-agent-war.ps1
          -AgentBinary ./target/debug/mcloving-agent.exe
      - name: Build release agent
        shell: pwsh
        run: cargo +1.97.1 build --locked --release -p mcloving-agent
      - name: Run native service and crash-recovery war gate
        shell: pwsh
        run: >-
          ./scripts/windows-agent-war.ps1
          -AgentBinary ./target/release/mcloving-agent.exe
