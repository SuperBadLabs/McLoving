[package]
name = "mcloving-execution-spine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mcloving-agent-runtime = { version = "0.0.0", path = "../agent-runtime" }
mcloving-controller-store = { version = "0.0.0", path = "../controller-store" }
mcloving-destination-observer = { version = "0.0.0", path = "../destination-observer" }
mcloving-external-connector = { version = "0.0.0", path = "../external-connector" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.17"
tokio = { version = "=1.47.1", features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "time",
] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
uuid = { version = "=1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
axum = "=0.8.6"
mcloving-controller-api = { version = "0.0.0", path = "../controller-api" }
reqwest = { version = "=0.12.23", default-features = false, features = [
  "json",
  "rustls-tls-native-roots",
] }
sqlx = { version = "=0.8.6", default-features = false, features = [
  "runtime-tokio",
  "postgres",
] }
tempfile = "=3.27.0"

[lints]
workspace = true
