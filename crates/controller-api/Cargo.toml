[package]
name = "mcloving-controller-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = "=0.8.6"
base64 = "=0.22.1"
http = "=1.3.1"
jsonwebtoken = "=9.3.1"
mcloving-controller-store = { version = "0.0.0", path = "../controller-store" }
mcloving-object-store = { version = "0.0.0", path = "../object-store" }
mcloving-pipeline-ir = { version = "0.0.0", path = "../pipeline-ir" }
reqwest = { version = "=0.12.23", default-features = false, features = [
  "json",
  "rustls-tls-native-roots",
] }
rand = "=0.8.7"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.17"
uuid = { version = "=1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
sqlx = { version = "=0.8.6", default-features = false, features = [
  "postgres",
  "runtime-tokio",
] }
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread"] }
tower = "=0.5.3"

[lints]
workspace = true
