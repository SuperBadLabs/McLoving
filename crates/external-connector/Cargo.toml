[package]
name = "mcloving-external-connector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
loopback-test = []

[[bin]]
name = "mcloving-external-connector"
path = "src/main.rs"

[[bin]]
name = "mcloving-external-shadow-replay"
path = "src/bin/shadow_replay.rs"

[[bin]]
name = "mcloving-external-shadow-network-probe"
path = "src/bin/shadow_network_probe.rs"
required-features = ["loopback-test"]

[[test]]
name = "connector_contract"
path = "tests/connector_contract.rs"
required-features = ["loopback-test"]

[dependencies]
base64 = "=0.22.1"
mcloving-destination-observer = { path = "../destination-observer" }
reqwest = { version = "=0.12.23", default-features = false, features = [
  "http2",
  "json",
  "rustls-tls-native-roots",
] }
ring = "=0.17.14"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["arbitrary_precision"] }
sha2 = "=0.10.9"
thiserror = "=2.0.17"
tokio = { version = "=1.47.1", features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "rt-multi-thread",
  "time",
] }
url = "=2.5.8"
uuid = { version = "=1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
axum = "=0.8.6"
serde-saphyr = "=1.0.0-rc.2"
tempfile = "=3.27.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", features = ["fs", "user"] }

[lints]
workspace = true
