[package]
name = "mcloving-source-acquirer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
aho-corasick = "=1.1.4"
base64 = "=0.22.1"
caseless = "=0.2.2"
hmac = "=0.12.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.17"
tokio = { version = "=1.47.1", features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
url = "=2.5.8"
unicode-normalization = "=0.1.25"
uuid = { version = "=1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
axum = "=0.8.6"
serde-saphyr = "=1.0.0-rc.2"
tempfile = "=3.27.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", features = ["fs", "process", "sched", "signal", "time", "user"] }

[lints]
workspace = true
