syntax = "proto3";

package mcloving.agent.v1;

service AgentControl {
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
  rpc RotateCertificate(RotateCertificateRequest) returns (RotateCertificateResponse);
  rpc Reconcile(ReconciliationReport) returns (ReconciliationDirective);
  rpc CompleteCancellation(CancellationCompletion) returns (CancellationReceipt);
  rpc PollWork(WorkPoll) returns (WorkOffer);
  rpc AcceptWork(WorkAuthority) returns (WorkReceipt);
  rpc StartWork(WorkAuthority) returns (WorkReceipt);
  rpc FetchCredentials(CredentialRequest) returns (CredentialEnvelope);
  rpc RenewWorkLease(WorkLeaseRenewal) returns (WorkLeaseReceipt);
  rpc PublishLog(WorkLogChunk) returns (WorkReceipt);
  rpc CompleteWork(WorkCompletion) returns (WorkReceipt);
}

message ProtocolOffer {
  uint32 major = 1;
  uint32 minimum_minor = 2;
  uint32 maximum_minor = 3;
  repeated string features = 4;
}

message OpenSessionRequest {
  string agent_id = 1;
  uint64 session_epoch = 2;
  ProtocolOffer protocol = 3;
  string trust_pool = 4;
  repeated string capabilities = 5;
}

message OpenSessionResponse {
  uint64 session_epoch = 1;
  uint32 protocol_minor = 2;
  repeated string features = 3;
  int64 certificate_not_after_unix_ms = 4;
}

message RotateCertificateRequest {
  string agent_id = 1;
  uint64 session_epoch = 2;
  uint64 certificate_epoch = 3;
  bytes certificate_signing_request_der = 4;
}

message RotateCertificateResponse {
  uint64 certificate_epoch = 1;
  bytes leaf_certificate_pem = 2;
  bytes certificate_chain_pem = 3;
}

message AttemptState {
  string organization_id = 1;
  string attempt_id = 2;
  uint64 fence_token = 3;
  string phase = 4;
  bytes payload_digest = 5;
  optional uint32 process_id = 6;
  string workspace = 7;
  repeated SpoolEntry logs = 8;
  optional SpoolEntry result = 9;
  optional string process_birth_identity = 10;
}

message SpoolEntry {
  string relative_path = 1;
  bytes digest = 2;
  uint64 bytes = 3;
  uint64 sequence = 4;
}

message ReconciliationReport {
  string agent_id = 1;
  uint64 session_epoch = 2;
  repeated AttemptState attempts = 3;
}

message ReconciliationDirective {
  uint64 session_epoch = 1;
  repeated AttemptAuthority retain_attempts = 2;
  repeated AttemptAuthority cancel_attempts = 3;
}

message AttemptAuthority {
  string organization_id = 1;
  string attempt_id = 2;
  uint64 fence_token = 3;
}

message CancellationCompletion {
  string agent_id = 1;
  uint64 session_epoch = 2;
  string organization_id = 3;
  string attempt_id = 4;
  uint64 fence_token = 5;
  CancellationOutcome outcome = 6;
}

enum CancellationOutcome {
  CANCELLATION_OUTCOME_UNSPECIFIED = 0;
  CANCELLATION_OUTCOME_TERMINATED = 1;
  CANCELLATION_OUTCOME_RECONCILIATION_REQUIRED = 2;
  CANCELLATION_OUTCOME_ALREADY_EXITED = 3;
  CANCELLATION_OUTCOME_IDENTITY_MISMATCH = 4;
}

message CancellationReceipt {
  uint64 session_epoch = 1;
  CancellationDisposition disposition = 2;
}

enum CancellationDisposition {
  CANCELLATION_DISPOSITION_UNSPECIFIED = 0;
  CANCELLATION_DISPOSITION_COMPLETED = 1;
  CANCELLATION_DISPOSITION_RETIRE_STALE = 2;
  CANCELLATION_DISPOSITION_RECONCILIATION_REQUIRED = 3;
}

message WorkPoll {
  string agent_id = 1;
  uint64 session_epoch = 2;
  string organization_id = 3;
  reserved 4;
  uint32 lease_seconds = 5;
}

message WorkOffer {
  uint64 session_epoch = 1;
  optional WorkAssignment assignment = 2;
}

message WorkAssignment {
  string organization_id = 1;
  string build_id = 2;
  string node_id = 3;
  string attempt_id = 4;
  uint64 fence_token = 5;
  bytes execution_spec_json = 6;
  bytes payload_digest = 7;
}

message WorkAuthority {
  string agent_id = 1;
  uint64 session_epoch = 2;
  string organization_id = 3;
  string attempt_id = 4;
  uint64 fence_token = 5;
}

message CredentialBinding {
  string grant_id = 1;
  string target_name = 2;
  bytes secret_value = 3;
}

message CredentialRequest {
  WorkAuthority authority = 1;
  repeated string target_names = 2;
}

message CredentialEnvelope {
  uint64 session_epoch = 1;
  repeated CredentialBinding credentials = 2;
  bool ready = 3;
}

message WorkLeaseRenewal {
  WorkAuthority authority = 1;
  uint32 lease_seconds = 2;
}

message WorkLeaseReceipt {
  uint64 session_epoch = 1;
  bool accepted = 2;
  bool cancellation_requested = 3;
  // Names the store's refusal cause on a rejected renewal so the agent's
  // durable result agrees with the controller's recorded event. Empty when
  // accepted or when the refusal happened before the store path.
  string rejection_cause = 4;
}

message WorkLogChunk {
  WorkAuthority authority = 1;
  uint64 sequence = 2;
  string stream = 3;
  bytes content = 4;
}

message WorkCompletion {
  WorkAuthority authority = 1;
  WorkOutcome outcome = 2;
  bytes summary_json = 3;
}

enum WorkOutcome {
  WORK_OUTCOME_UNSPECIFIED = 0;
  WORK_OUTCOME_SUCCEEDED = 1;
  WORK_OUTCOME_FAILED = 2;
  WORK_OUTCOME_ABORTED = 3;
}

message WorkReceipt {
  uint64 session_epoch = 1;
  bool accepted = 2;
  // What the controller actually published. A committed cancellation can
  // override a non-succeeded terminal at the publishing row lock, and the
  // agent must journal what landed, not what it asked for.
  WorkOutcome published_outcome = 3;
}
