[package]
name = "mcloving-agent-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
prost = "=0.14.4"
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std"] }
