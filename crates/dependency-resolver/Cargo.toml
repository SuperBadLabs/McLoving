[package]
name = "mcloving-dependency-resolver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "=0.22.1"
hmac = "=0.12.1"
reqwest = { version = "=0.12.23", default-features = false, features = ["rustls-tls-native-roots"] }
ring = "=0.17.14"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.17"
tokio = { version = "=1.47.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "time"] }
url = "=2.5.8"
uuid = { version = "=1.18.1", features = ["serde", "v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", features = ["fs", "user"] }

[dev-dependencies]
axum = "=0.8.6"
serde-saphyr = "=1.0.0-rc.2"
tempfile = "=3.27.0"

[lints]
workspace = true
