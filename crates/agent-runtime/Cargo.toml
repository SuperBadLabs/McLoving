[package]
name = "mcloving-agent-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
aho-corasick = "=1.1.4"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
sha2 = "=0.10.9"
thiserror = "=2.0.17"
tokio = { version = "=1.47.1", features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "time",
] }
tokio-util = { version = "=0.7.19", features = ["rt"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", features = ["process", "signal"] }

[target.'cfg(windows)'.dependencies]
mcloving-windows-job = { version = "0.0.0", path = "../windows-job" }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
