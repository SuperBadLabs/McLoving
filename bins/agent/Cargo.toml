[package]
name = "mcloving-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mcloving-input-adapter = { version = "0.0.0", path = "../../crates/input-adapter" }
mcloving-cache = { version = "0.0.0", path = "../../crates/cache" }
base64 = "=0.22.1"
mcloving-agent-protocol = { version = "0.0.0", path = "../../crates/agent-protocol" }
mcloving-agent-runtime = { version = "0.0.0", path = "../../crates/agent-runtime" }
mcloving-domain = { version = "0.0.0", path = "../../crates/domain" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
thiserror = "=2.0.17"
tokio = { version = "=1.47.1", features = [
  "fs",
  "io-util",
  "macros",
  "rt-multi-thread",
  "signal",
  "time",
] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
tonic = { version = "=0.14.6", features = ["tls-ring", "transport"] }
uuid = { version = "=1.18.1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-services = "=0.26.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", features = ["dir", "signal", "fs", "user"] }

[target.'cfg(target_os = "linux")'.dependencies]
mcloving-source-acquirer = { version = "0.0.0", path = "../../crates/source-acquirer" }

[dev-dependencies]
tokio-stream = { version = "=0.1.19", features = ["net"] }
mcloving-pipeline-ir = { version = "0.0.0", path = "../../crates/pipeline-ir" }
mcloving-controller-api = { version = "0.0.0", path = "../../crates/controller-api" }
mcloving-controller-store = { version = "0.0.0", path = "../../crates/controller-store" }
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", features = ["postgres", "runtime-tokio"] }
tempfile = "=3.27.0"
url = "=2.5.8"
uuid = { version = "=1.18.1", features = ["v4"] }

[lints]
workspace = true
