[package]
name = "mcloving-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "=1.0.104"
axum = "=0.8.6"
mcloving-controller-api = { version = "0.0.0", path = "../../crates/controller-api" }
mcloving-controller-store = { version = "0.0.0", path = "../../crates/controller-store" }
mcloving-execution-spine = { version = "0.0.0", path = "../../crates/execution-spine" }
mcloving-object-store = { version = "0.0.0", path = "../../crates/object-store" }
mcloving-agent-protocol = { version = "0.0.0", path = "../../crates/agent-protocol" }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = [
  "runtime-tokio",
  "postgres",
] }
tokio = { version = "=1.47.1", features = [
  "fs",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "time",
] }
tokio-stream = { version = "=0.1.19", features = ["net"] }
tonic = { version = "=0.14.6", features = ["tls-ring", "transport"] }
uuid = { version = "=1.18.1" }

[dev-dependencies]
tempfile = "=3.27.0"

[lints]
workspace = true
