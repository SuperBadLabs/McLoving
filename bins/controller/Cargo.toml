[package]
name = "mcloving-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "=1.0.100"
axum = "=0.8.6"
mcloving-controller-api = { version = "0.0.0", path = "../../crates/controller-api" }
mcloving-controller-store = { version = "0.0.0", path = "../../crates/controller-store" }
sqlx = { version = "=0.8.6", default-features = false, features = [
  "runtime-tokio",
  "postgres",
] }
tokio = { version = "=1.47.1", features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
