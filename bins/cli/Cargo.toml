[package]
name = "mcloving-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.5.48", features = ["derive", "env"] }
clap_complete = "=4.5.58"
mcloving-controller-api = { version = "0.0.0", path = "../../crates/controller-api" }
mcloving-domain = { version = "0.0.0", path = "../../crates/domain" }
serde = { version = "=1.0.228" }
serde_json = "=1.0.145"
tokio = { version = "=1.47.1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "time",
] }
uuid = { version = "=1.18.1", features = ["serde"] }

[dev-dependencies]
axum = "=0.8.6"

[lints]
workspace = true
