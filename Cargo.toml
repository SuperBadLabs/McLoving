[workspace]
resolver = "2"
members = [
  "bins/agent",
  "bins/cli",
  "bins/controller",
  "crates/agent-protocol",
  "crates/agent-runtime",
  "crates/boundary-differential",
  "crates/cache",
  "crates/canary-qualification",
  "crates/controller-api",
  "crates/controller-store",
  "crates/dependency-resolver",
  "crates/differential-aggregate",
  "crates/destination-observer",
  "crates/domain",
  "crates/external-connector",
  "crates/execution-spine",
  "crates/input-adapter",
  "crates/jenkins-compiler-admission",
  "crates/jenkins-differential",
  "crates/jenkins-inventory",
  "crates/jenkins-mapping-catalog",
  "crates/jenkins-state-transfer",
  "crates/jenkins-shared-library",
  "crates/migration-package",
  "crates/object-store",
  "crates/pipeline-ir",
  "crates/provisioner",
  "crates/release-provenance",
  "crates/secret-broker",
  "crates/shadow-qualification",
  "crates/source-acquirer",
  "crates/state-policy-differential",
  "crates/state-transfer",
  "crates/windows-job",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

# Dependencies are optimized even in dev/test builds; our own crates stay at
# opt-level 0 so they remain debuggable and compile fast.
#
# Motivation, measured: the source-acquirer suite sha256s git's entire runtime
# closure on every acquisition, and at opt-level 0 the sha2 implementation
# dominated the run. That suite is 99.6% of the Foundation gate's wall clock
# (27m17s of 27m24s), so this is the cheapest lever the gate has.
[profile.dev.package."*"]
opt-level = 2
