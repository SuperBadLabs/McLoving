[workspace]
resolver = "2"
members = [
  "bins/agent",
  "bins/cli",
  "bins/controller",
  "crates/agent-protocol",
  "crates/agent-runtime",
  "crates/controller-api",
  "crates/controller-store",
  "crates/domain",
  "crates/pipeline-ir",
  "crates/state-machine",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
